spring:
  application:
    name: order-service
  datasource:
    # 값은 K8s Deployment 환경변수(SPRING_DATASOURCE_URL/USERNAME/PASSWORD)로 주입한다
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/app}
    username: ${SPRING_DATASOURCE_USERNAME:app}
    password: ${SPRING_DATASOURCE_PASSWORD:app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  lifecycle:
    # SIGTERM 후 처리 중인 요청을 마칠 시간. terminationGracePeriodSeconds 보다 짧아야 한다
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

devbook:
  product-service:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8081}
    connect-timeout: 1s
    read-timeout: 2s
